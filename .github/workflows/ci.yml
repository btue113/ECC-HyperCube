name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite (release)
        run: cargo test --release
      - name: Build examples and benches
        run: cargo build --release --examples --benches
      - name: Check docs
        run: cargo doc --no-deps
      - name: Run clippy
        run: cargo clippy --lib --bins --tests
