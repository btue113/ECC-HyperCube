name: Perf

# Times fixed decode workloads on pushes to main that touch code, normalized to reference
# us/word via a pinned baseline commit measured on the same runner (runner CPUs differ by
# 1.3-1.6x), and appends them to a history chart on GitHub Pages (gh-pages, /dev/bench/).
# See ci/perf.py.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "examples/perf_ci.rs"
      - "ci/perf.py"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Newest commit with every workload when baseline timing was introduced. Changing it changes
  # the unit of the whole history: re-run the Perf backfill workflow afterwards.
  PERF_BASELINE: 179e6b2045ed92e0083cef39068e0972f93ec365
  # Pin rustc so LLVM upgrades don't introduce step changes; keep in sync with perf-backfill.yml.
  RUST_TOOLCHAIN: "1.99.0"

concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Run perf workloads against the baseline
        run: python3 ci/perf.py measure --rev "$GITHUB_SHA" --base "$PERF_BASELINE" --work "$RUNNER_TEMP/perf" --out perf.json
      - name: Store results and update chart
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ecc-hypercube decode time
          tool: customSmallerIsBetter
          output-file-path: perf.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Values are relative to the baseline on the same runner, so runner speed mostly cancels;
          # what remains is a few percent. Alerts are commit comments; they never fail the build.
          alert-threshold: "115%"
          comment-on-alert: true
          fail-on-alert: false
